[package]
name = "oxystudio"
description = "Desktop launcher and hub for Oxy applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oxystudio"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
env_logger.workspace = true
log.workspace = true
oxystudio-core = { path = "../oxystudio-core" }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }

